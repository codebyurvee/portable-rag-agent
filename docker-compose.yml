# Minimal two-service demo: FastAPI backend + Streamlit UI.
# Secrets are read from your local .env at runtime and are never baked into the image.
services:
  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - agent-db:/app/database

  ui:
    build: .
    command: streamlit run ui/app.py --server.address 0.0.0.0 --server.port 8501 --server.headless true
    ports:
      - "8501:8501"
    environment:
      - API_BASE_URL=http://api:8000
    depends_on:
      - api

volumes:
  agent-db:
